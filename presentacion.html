<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Procesos Industriales de Refinación — Presentación</title>
<style>
  :root{
    --bg:#0e1320; --bg2:#161d2e; --panel:#1b2436; --border:#2c3850;
    --text:#e9eef6; --muted:#9aa6bd; --accent:#ea580c; --accent2:#4aa3ff;
    --c-des:#0ea5e9; --c-cdu:#2563eb; --c-vdu:#7c3aed; --c-fcc:#dc2626;
    --c-hck:#0d9488; --c-ref:#d97706; --c-alk:#db2777; --c-iso:#65a30d;
    --c-hdt:#06b6d4; --c-amn:#6366f1; --c-sru:#eab308; --c-sws:#14b8a6; --c-mrx:#84cc16;
    --c-hds:#2ecc71; --c-cok:#b91c1c; --c-cla:#facc15;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at top,#1a2336,#0b1020 70%);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    overflow:hidden;
  }
  #deck{position:fixed;inset:0;}
  .slide{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;
    padding:clamp(24px,4vw,64px) clamp(28px,6vw,110px);
    opacity:0;transition:opacity .35s ease;
    overflow:auto;
  }
  .slide.active{display:flex;opacity:1;}
  .slide h1{font-size:clamp(28px,5.2vw,58px);line-height:1.08;letter-spacing:.5px;}
  .slide h2{font-size:clamp(22px,3.6vw,40px);line-height:1.12;margin-bottom:.4em;}
  .slide h3{font-size:clamp(16px,2.1vw,24px);color:var(--accent2);margin:.2em 0 .35em;}
  .slide p,.slide li{font-size:clamp(14px,1.75vw,21px);line-height:1.5;color:#dbe3f0;}
  .muted{color:var(--muted)!important;}
  .tag{
    display:inline-block;padding:4px 14px;border-radius:999px;
    font-size:clamp(11px,1.3vw,15px);font-weight:600;letter-spacing:.5px;
    background:rgba(255,255,255,.08);border:1px solid var(--border);
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .chip{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:6px 12px;font-size:clamp(12px,1.5vw,17px);
  }
  ul{padding-left:1.1em;}
  li{margin:.32em 0;}
  .center{justify-content:center;align-items:center;text-align:center;}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,46px);flex:1;min-height:0;}
  @media(max-width:760px){.cols{grid-template-columns:1fr;gap:16px;}}
  .card{
    background:rgba(27,36,54,.7);border:1px solid var(--border);
    border-radius:14px;padding:clamp(14px,2vw,24px);
  }
  .kicker{font-size:clamp(13px,1.6vw,18px);font-weight:700;letter-spacing:2px;text-transform:uppercase;}
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px;}
  .flow .node{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-weight:600;font-size:clamp(13px,1.6vw,19px);}
  .flow .arrow{color:var(--accent);font-size:clamp(18px,2.4vw,28px);}
  .pill{display:inline-flex;align-items:center;gap:8px;}
  .dot{width:14px;height:14px;border-radius:50%;display:inline-block;}
  table{border-collapse:collapse;width:100%;font-size:clamp(12px,1.5vw,18px);margin-top:10px;}
  th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;}
  th{background:#22304a;}
  tr:nth-child(even) td{background:rgba(255,255,255,.03);}
  .accentbar{height:6px;border-radius:6px;width:90px;margin:14px 0 22px;}
  /* HUD */
  #bar{position:fixed;top:0;left:0;height:4px;background:var(--accent);width:0;z-index:50;transition:width .3s;}
  #hud{position:fixed;bottom:14px;right:18px;display:flex;gap:8px;align-items:center;z-index:50;}
  #hud button{
    background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
  }
  #hud button:hover{border-color:var(--accent);color:var(--accent);}
  #count{position:fixed;bottom:20px;left:20px;color:var(--muted);font-size:14px;z-index:50;}
  #hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:12px;z-index:50;}
  /* impresión / overview */
  body.print{overflow:auto;}
  body.print #deck{position:static;}
  body.print .slide{position:relative;display:flex;opacity:1;page-break-after:always;height:100vh;border-bottom:1px solid var(--border);}
  body.print #hud,body.print #count,body.print #hint,body.print #bar{display:none;}
  @media print{
    body{background:#fff;color:#111;}
    .slide{height:auto;min-height:96vh;}
  }
</style>
</head>
<body>
<div id="bar"></div>
<div id="deck"></div>
<div id="count"></div>
<div id="hint">← →  espacio · F pantalla completa · P impresión</div>
<div id="hud">
  <button id="prev" title="Anterior">‹</button>
  <button id="next" title="Siguiente">›</button>
  <button id="full" title="Pantalla completa">⤢</button>
  <button id="print" title="Modo impresión">⎙</button>
</div>

<script>
const UNITS = [
  {
    key:'des', color:'var(--c-des)', name:'Desalador de Crudo', role:'Acondicionamiento',
    what:'Quita la sal y el agua al crudo antes de destilarlo. Es la primera operación del proceso.',
    feed:'Crudo', prod:'Crudo desalado (+ salmuera al tratamiento de efluentes)',
    inside:[
      'El crudo se precalienta y se mezcla con agua de lavado en la <b>válvula de mezcla</b>.',
      'La emulsión entra a recipientes con un <b>campo eléctrico de alto voltaje</b>.',
      'El campo une las gotas de agua salada (coalescencia) y decantan como <b>salmuera</b>.',
      'El crudo desalado sale por arriba; suele haber <b>dos etapas</b> en serie.'
    ],
    equip:['Bombas de carga','Precalentadores','Válvula de mezcla','Desaladores electrostáticos','Sistema de salmuera'],
    why:'La sal causa corrosión y ensucia la columna: hay que quitarla primero.'
  },
  {
    key:'cdu', color:'var(--c-cdu)', name:'Destilación Atmosférica (CDU)', role:'Separación',
    what:'Separa el crudo en sus grandes familias de productos según su punto de ebullición, a presión cercana a la atmosférica.',
    feed:'Crudo desalado', prod:'Gases, naftas, kerosene, LGO, HGO y residuo atmosférico',
    inside:[
      'El <b>horno</b> calienta el crudo a ~360 °C; entra a la <b>zona de flasheo</b>.',
      'El vapor sube y se enfría: cada nivel condensa un <b>corte</b> distinto.',
      'Los cortes pasan por <b>side strippers</b> que ajustan su calidad con vapor.',
      'Los <b>pumparounds</b> retiran calor; el <b>reflujo</b> sostiene la separación.'
    ],
    equip:['Horno de carga','Columna + platos','Side strippers','Sistema de cabeza','Pumparounds'],
    why:'Separación física (sin reacción). Todo lo demás de la refinería depende de ella.'
  },
  {
    key:'vdu', color:'var(--c-vdu)', name:'Destilación al Vacío (VDU)', role:'Separación',
    what:'Recupera gasóleos valiosos del residuo atmosférico destilándolo al vacío.',
    feed:'Residuo atmosférico', prod:'LVGO, HVGO (carga a FCC/HCK) y residuo de vacío (asfalto)',
    inside:[
      'Trabajar <b>al vacío</b> baja el punto de ebullición y evita el coquizado.',
      'Un <b>sistema de eyectores de vapor</b> genera el vacío (25–50 mm Hg).',
      'La torre es <b>swaged</b> (ancha arriba) por el gran volumen de vapor.',
      'Los <b>intercondensadores</b> condensan y descargan al <b>sump</b>.'
    ],
    equip:['Horno','Torre swaged','Eyectores de vapor','Intercondensadores','Sump'],
    why:'La clave no es química sino de presión: el vacío permite separar sin degradar.'
  },
  {
    key:'fcc', color:'var(--c-fcc)', name:'Craqueo Catalítico (FCC)', role:'Conversión',
    what:'Rompe gasóleos pesados de bajo valor en productos ligeros, sobre todo gasolina. La "fábrica de gasolina".',
    feed:'Gasóleo pesado de vacío (HVGO)', prod:'GLP, gasolina, LCO (≈diésel) y slurry',
    inside:[
      'La carga sube por el <b>riser</b> con catalizador caliente: craquea en <b>2–4 s</b>.',
      'Los <b>ciclones</b> separan el catalizador de los vapores de producto.',
      'El catalizador con <b>coque</b> pasa al <b>regenerador</b>, que lo quema.',
      'Ese calor reactiva el catalizador y alimenta la reacción: se autoabastece.'
    ],
    equip:['Riser','Reactor/ciclones','Regenerador','Líneas de catalizador','Fraccionadora'],
    why:'Conversión catalítica sin hidrógeno. El catalizador circula en lazo continuo.'
  },
  {
    key:'hck', color:'var(--c-hck)', name:'Hidrocraqueo (Hydrocracking)', role:'Conversión',
    what:'Rompe e hidrogena moléculas pesadas con hidrógeno a muy alta presión. Da los combustibles más limpios.',
    feed:'Gasóleos de vacío (VGO)', prod:'Diésel y jet de alta calidad, naftas, GLP',
    inside:[
      '<b>R-1</b> hace hidrotratamiento (quita azufre y nitrógeno).',
      '<b>R-2</b> hidrocraquea: rompe y el H₂ satura los fragmentos.',
      'Se inyecta H₂ frío (<b>quench</b>) entre lechos para controlar la temperatura.',
      'El H₂ se separa, se limpia en <b>aminas</b> y se recircula con compresor.'
    ],
    equip:['Reactores R-1/R-2','Quench','Separadores HP/LP','Absorbedor de aminas','Compresores de H₂'],
    why:'Conversión con hidrógeno a 150–175 bar. Exotérmica: por eso el quench.'
  },
  {
    key:'ref', color:'var(--c-ref)', name:'Reformado Catalítico (CCR)', role:'Conversión',
    what:'Convierte nafta pesada de bajo octanaje en reformado de alto octanaje y produce hidrógeno.',
    feed:'Nafta pesada (de la CDU)', prod:'Reformado (RON 95–102) e hidrógeno',
    inside:[
      'La nafta pasa por <b>4 reactores apilados</b> de lecho móvil en serie.',
      'La reacción es <b>endotérmica</b>: hay un <b>horno</b> antes de cada reactor.',
      'Un <b>regenerador continuo</b> quema el coque y reactiva el catalizador.',
      'Genera el <b>hidrógeno</b> que usan el hidrotratamiento y el hidrocraqueo.'
    ],
    equip:['Reactores apilados','Hornos intermedios','Regenerador CCR','Separador de H₂','Estabilizador'],
    why:'Eleva el octanaje (aromáticos) y es la principal fuente de H₂ de la refinería.'
  },
  {
    key:'alk', color:'var(--c-alk)', name:'Alquilación (H₂SO₄)', role:'Conversión',
    what:'Une isobutano con olefinas ligeras usando ácido sulfúrico para producir alquilato: gasolina premium.',
    feed:'Isobutano + olefinas (C3/C4 del FCC)', prod:'Alquilato (gasolina de alto octanaje)',
    inside:[
      'Se emulsionan olefinas, isobutano y <b>ácido sulfúrico</b> en el <b>contactor</b>.',
      'La reacción es muy exotérmica: se opera <b>en frío (4–10 °C)</b>.',
      'El <b>decantador</b> separa el ácido (vuelve) del hidrocarburo.',
      'El <b>desisobutanizador</b> recupera el alquilato y recicla isobutano.'
    ],
    equip:['Contactor','Decantador de ácido','Ciclo de refrigeración','Desisobutanizador','Tanques de ácido'],
    why:'Alquilato sin azufre, aromáticos ni olefinas: una base de gasolina ideal.'
  },
  {
    key:'iso', color:'var(--c-iso)', name:'Isomerización (C5/C6)', role:'Conversión',
    what:'Reordena n-pentano y n-hexano en sus isómeros ramificados, que tienen mucho más octanaje.',
    feed:'Nafta ligera (C5/C6)', prod:'Isomerato de alto octanaje',
    inside:[
      'Catalizador de <b>alúmina clorada</b>, muy sensible al agua.',
      'Los <b>secadores</b> dejan la carga casi seca (el agua es veneno).',
      'Reactores <b>lead-lag</b> a baja temperatura (favorece los ramificados).',
      'Se dosifica <b>cloruro orgánico</b> para mantener la acidez del catalizador.'
    ],
    equip:['Secadores','Reactores lead-lag','Inyección de cloruro','Estabilizador','Desisohexanizador'],
    why:'A baja temperatura el equilibrio favorece los isómeros de mayor octanaje.'
  },
  {
    key:'hds', color:'var(--c-hds)', name:'Hidrotratamiento (HDS/HDN)', role:'Tratamiento',
    what:'Elimina azufre, nitrógeno y metales de naftas, diésel y gasóleos usando hidrógeno y catalizador. Es el "limpiador" de la refinería.',
    feed:'Nafta, diésel, queroseno, VGO + H₂', prod:'Producto limpio (<15 ppm S), H₂S (→ Claus) y NH₃',
    inside:[
      'El H₂ reacciona con compuestos de azufre sobre catalizador <b>CoMo o NiMo</b> en lecho fijo.',
      'R-S-R + H₂ → R-H + <b>H₂S</b> (hidrodesulfuración).',
      'R-N-R + H₂ → R-H + <b>NH₃</b> (hidrodesnitrogenación).',
      'El H₂S se envía al <b>proceso Claus</b> para recuperar azufre elemental.'
    ],
    equip:['Reactor de lecho fijo','Compresor de H₂','Separador HP/LP','Absorbedor de aminas','Stripper de H₂S'],
    why:'Sin hidrotratamiento los combustibles no cumplen normas Euro V / TIER 3 (<15 ppm S).'
  },
  {
    key:'cok', color:'var(--c-cok)', name:'Coquización Retardada (Delayed Coking)', role:'Conversión',
    what:'Descompone térmicamente el residuo de vacío —lo más pesado del crudo— en productos ligeros y coque sólido.',
    feed:'Residuo de vacío (>550 °C)', prod:'Nafta, gasóleo, gas y coque de petróleo',
    inside:[
      'El residuo se calienta a <b>500 °C</b> en un horno y entra a <b>tambores verticales</b> de 25 m.',
      'Dentro del tambor el calor <b>rompe térmicamente</b> las moléculas; los livianos salen como vapor.',
      'Lo que queda se solidifica como <b>coque de petróleo</b>; se corta con chorros de agua a alta presión.',
      'Operan <b>2 tambores alternados</b>: 24 h de llenado + 24 h de descoque.'
    ],
    equip:['Horno de coquización','Tambores (2)','Sistema de corte hidráulico','Fraccionadora','Foso de coque'],
    why:'Sin esta unidad, el ~30 % del crudo pesado sería residuo sin valor. El coque se vende a cementeras y acerías.'
  },
  {
    key:'cla', color:'var(--c-cla)', name:'Recuperación de Azufre (Claus)', role:'Tratamiento',
    what:'Convierte el H₂S tóxico (del hidrotratamiento y el endulzamiento) en azufre elemental vendible.',
    feed:'H₂S del hidrotratamiento y del endulzamiento con aminas', prod:'Azufre elemental sólido (99,9 %) y gas de cola',
    inside:[
      '<b>Etapa térmica:</b> se quema ⅓ del H₂S con aire a 1 000 °C → SO₂ + H₂O.',
      '<b>Etapa catalítica:</b> 2 H₂S + SO₂ → 3 S + 2 H₂O sobre catalizador de <b>alúmina</b>.',
      'El azufre se condensa como <b>líquido amarillo</b> y luego se solidifica.',
      'Se usan <b>2-3 reactores en serie</b> para alcanzar 95-97 % de recuperación.'
    ],
    equip:['Horno de reacción','Reactores catalíticos (2-3)','Condensadores de azufre','Foso de azufre','TGTU (gas de cola)'],
    why:'Cierra el ciclo ambiental: transforma un gas tóxico en un producto industrial útil (fertilizantes, caucho, H₂SO₄).'
  },
];

slides.push(`

    <h1 style="margin:.2em 0">Procesos Industriales<br>de Refinación</h1>

// Idea central
slides.push(`
  <div class="slide">
    <div class="kicker muted">La idea central</div>

// Flujo

// Slide divisoria por categoría
function divider(text, color){
  return `<div class="slide center">
    <div class="accentbar" style="background:${color};margin:0 auto 18px"></div>
    <h1>${text}</h1>
  </div>`;
}
slides.push(divider('Las unidades, una a una', 'var(--accent)'));

// Cuadro comparativo

  </div>`);

// ---- Motor de presentación ----
const deck = document.getElementById('deck');
deck.innerHTML = slides.join('');
const slideEls = [...document.querySelectorAll('.slide')];
let idx = 0;

function show(n){
  idx = Math.max(0, Math.min(slideEls.length-1, n));
  slideEls.forEach((s,i)=>s.classList.toggle('active', i===idx));
  document.getElementById('bar').style.width = ((idx)/(slideEls.length-1)*100)+'%';
  document.getElementById('count').textContent = (idx+1)+' / '+slideEls.length;
  if(!document.body.classList.contains('print')) location.hash = idx+1;
}
function next(){ show(idx+1); }
function prev(){ show(idx-1); }

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('full').onclick = ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};
document.getElementById('print').onclick = ()=>{
  document.body.classList.toggle('print');
  if(!document.body.classList.contains('print')) show(idx);
};

window.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ show(0); }
  else if(e.key==='End'){ show(slideEls.length-1); }
  else if(e.key==='f'||e.key==='F'){ document.getElementById('full').click(); }
  else if(e.key==='p'||e.key==='P'){ document.getElementById('print').click(); }
});

// click para avanzar (ignorando botones/enlaces)
deck.addEventListener('click', e=>{ if(!e.target.closest('button,a')) next(); });

// swipe en móvil
let tx=0;
deck.addEventListener('touchstart', e=>{ tx=e.changedTouches[0].clientX; }, {passive:true});
deck.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX - tx;
  if(Math.abs(dx)>50){ dx<0 ? next() : prev(); }
}, {passive:true});

// arranque desde hash
const start = parseInt(location.hash.replace('#',''),10);
show(Number.isFinite(start) && start>0 ? start-1 : 0);
</script>
